[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "desktopper"
version = "0.1.0"
description = "Local macOS app that builds information models from ordinary language"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "Flask==3.1.2",
  "PyYAML==6.0.2",
]

[project.scripts]
desktopper = "app.server:main"

[tool.setuptools.packages.find]
include = ["app*"]
