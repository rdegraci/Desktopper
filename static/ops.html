<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ops — Desktopper</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css" />
  </head>
  <body>
    <nav class="navbar navbar-light bg-light border-bottom">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1" id="app-title">Ops</span>
        <a class="nav-link" href="/">App</a>
      </div>
    </nav>
    <div class="container py-4">
      <p class="small text-muted" id="schema-version"></p>
      <form id="intent-form">
        <label class="form-label" for="intent-text">Describe the app</label>
        <textarea
          class="form-control"
          id="intent-text"
          rows="6"
          required
        ></textarea>
        <div class="d-flex align-items-center gap-3 mt-3">
          <button type="submit" class="btn btn-primary" id="intent-submit">
            Submit
          </button>
          <div
            id="intent-busy"
            class="align-items-center gap-2 d-none"
            role="status"
            aria-live="polite"
          >
            <div class="spinner-border spinner-border-sm" aria-hidden="true"></div>
            <span id="intent-busy-label">Working…</span>
          </div>
        </div>
      </form>
      <p class="mt-3" id="intent-summary"></p>
      <p class="text-muted" id="intent-hint" hidden>
        Refresh the App tab to see the change.
      </p>
      <p class="text-danger" id="intent-error" hidden></p>
      <div id="hook-preview" class="mt-3" hidden>
        <label class="form-label" for="hook-preview-text">Hook changes</label>
        <textarea
          class="form-control font-monospace"
          id="hook-preview-text"
          rows="12"
          readonly
        ></textarea>
      </div>
      <hr />
      <h2 class="h5">Hooks</h2>
      <p class="text-muted small">
        Python runs on create, update, or delete. Edit code here or describe changes above.
      </p>
      <div class="table-responsive">
        <table class="table table-sm" id="hooks-table">
          <thead>
            <tr>
              <th>Id</th>
              <th>Table</th>
              <th>On</th>
              <th>Enabled</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="hooks-tbody"></tbody>
        </table>
      </div>
      <div id="hook-editor" class="mt-3" hidden>
        <p class="mb-1"><strong id="hook-editor-title"></strong></p>
        <textarea class="form-control font-monospace" id="hook-code" rows="14"></textarea>
        <div class="d-flex flex-wrap gap-2 mt-2">
          <button type="button" class="btn btn-primary" id="hook-save">Save</button>
          <button type="button" class="btn btn-outline-secondary" id="hook-toggle">
            Disable
          </button>
          <button type="button" class="btn btn-outline-danger" id="hook-delete">
            Delete
          </button>
          <button type="button" class="btn btn-link" id="hook-cancel">Cancel</button>
        </div>
        <p class="text-danger mt-2" id="hook-editor-error" hidden></p>
      </div>
      <hr />
      <button type="button" class="btn btn-outline-secondary" id="copy-logs">
        Copy recent logs
      </button>
      <label class="form-label mt-3" for="logs-text">Logs</label>
      <textarea
        class="form-control"
        id="logs-text"
        rows="10"
        readonly
      ></textarea>
    </div>
    <div class="modal fade" id="confirm-modal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Confirm delete</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body" id="confirm-modal-body">Delete this hook?</div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
            <button type="button" class="btn btn-danger" id="confirm-modal-ok">
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/ops.js"></script>
  </body>
</html>
