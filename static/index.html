<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Desktopper</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css" />
  </head>
  <body>
    <nav class="navbar navbar-light bg-light border-bottom">
      <div class="container-fluid flex-wrap gap-2">
        <span class="navbar-brand mb-0 h1" id="app-title">Desktopper</span>
        <div class="d-flex flex-wrap align-items-center gap-2" id="nav-screens"></div>
        <form class="d-flex" role="search" onsubmit="return false;">
          <input
            class="form-control form-control-sm"
            type="search"
            id="global-search"
            placeholder="Search"
            autocomplete="off"
          />
        </form>
        <a class="nav-link" href="/ops" target="_blank" rel="noopener">Ops</a>
        <span class="badge bg-danger" id="notices-badge" hidden>0</span>
      </div>
    </nav>
    <div class="container py-2">
      <div id="global-hits" class="list-group mb-2" hidden></div>
      <p id="error" class="text-danger" hidden></p>
    </div>
    <div class="container py-2">
      <div id="empty-state">
        <h1 class="h4">No screens yet</h1>
        <p class="text-muted">
          Open Ops in a new tab to describe the app. Then refresh this tab.
        </p>
      </div>
      <div id="main" hidden></div>
    </div>
    <div class="modal fade" id="confirm-modal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title h5">Confirm</h2>
          </div>
          <div class="modal-body" id="confirm-body"></div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
            <button type="button" class="btn btn-danger" id="confirm-ok">Delete</button>
          </div>
        </div>
      </div>
    </div>
    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
