<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Desktopper</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css" />
  </head>
  <body>
    <nav class="navbar navbar-light bg-light border-bottom">
      <div class="container-fluid flex-wrap gap-2">
        <span class="navbar-brand mb-0 h1" id="app-title">Desktopper</span>
        <div class="d-flex flex-wrap align-items-center gap-2" id="nav-screens"></div>
        <form class="d-flex" role="search" onsubmit="return false;">
          <input
            class="form-control form-control-sm"
            type="search"
            id="global-search"
            placeholder="Search"
            autocomplete="off"
          />
        </form>
        <a class="nav-link" href="/ops" target="_blank" rel="noopener">Ops</a>
        <a class="nav-link" href="/ops" target="_blank" rel="noopener" id="discuss-in-ops">Discuss in Ops</a>
        <span class="badge bg-danger" id="notices-badge" hidden>0</span>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="login-toggle">
          Login
        </button>
      </div>
    </nav>
    <div class="container py-2" id="login-panel" hidden>
      <form id="login-form" class="row g-2 align-items-end">
        <div class="col-auto">
          <label class="form-label" for="login-name">User</label>
          <input class="form-control form-control-sm" id="login-name" autocomplete="username" />
        </div>
        <div class="col-auto">
          <label class="form-label" for="login-password">Password</label>
          <input
            class="form-control form-control-sm"
            id="login-password"
            type="password"
            autocomplete="current-password"
          />
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-sm btn-primary">Sign in</button>
          <button type="button" class="btn btn-sm btn-link" id="logout-btn" hidden>
            Sign out
          </button>
        </div>
        <div class="col-12">
          <p class="text-danger small mb-0" id="login-error" hidden></p>
        </div>
      </form>
    </div>
    <div class="container py-2" id="import-panel" hidden>
      <div class="d-flex flex-wrap align-items-end gap-2">
        <div>
          <label class="form-label" for="import-profile">CSV import</label>
          <select class="form-select form-select-sm" id="import-profile"></select>
        </div>
        <label class="btn btn-sm btn-outline-secondary mb-0">
          Choose file
          <input type="file" id="import-file" accept=".csv,text/csv" hidden />
        </label>
      </div>
      <p class="small text-muted mb-0 mt-1" id="import-status"></p>
    </div>
    <div class="container py-2">
      <div id="global-hits" class="list-group mb-2" hidden></div>
      <p id="error" class="text-danger" hidden></p>
    </div>
    <div class="container py-2">
      <div id="empty-state">
        <h1 class="h4">No screens yet</h1>
        <p class="text-muted">
          Open Ops in a new tab to describe the app. Then refresh this tab.
        </p>
      </div>
      <div id="main" hidden></div>
    </div>
    <div class="modal fade" id="confirm-modal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title h5">Confirm</h2>
          </div>
          <div class="modal-body" id="confirm-body"></div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
            <button type="button" class="btn btn-danger" id="confirm-ok">Delete</button>
          </div>
        </div>
      </div>
    </div>
    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
