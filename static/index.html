<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Desktopper</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/layout.css" />
  </head>
  <body>
    <nav class="navbar navbar-light bg-light border-bottom">
      <div class="container-fluid flex-wrap gap-2">
        <span class="navbar-brand mb-0 h1" id="app-title">Desktopper</span>
        <div class="d-flex flex-wrap align-items-center gap-2" id="nav-screens"></div>
        <form class="d-flex d-none" role="search" onsubmit="return false;" id="global-search-form" hidden>
          <input
            class="form-control form-control-sm"
            type="search"
            id="global-search"
            placeholder="Search"
            autocomplete="off"
          />
        </form>
        <a class="nav-link" href="/ops" id="ops-link" hidden>Ops</a>
        <span class="badge bg-danger" id="notices-badge" hidden>0</span>
        <div class="d-flex align-items-center gap-2" id="session-cluster">
          <span class="small text-muted" id="session-user" hidden></span>
          <button type="button" class="btn btn-sm btn-outline-secondary" id="login-toggle">
            Login
          </button>
        </div>
      </div>
    </nav>
    <div class="container py-2" id="login-panel" hidden>
      <form id="login-form" class="row g-2 align-items-end">
        <div class="col-auto">
          <label class="form-label" for="login-name">User</label>
          <input class="form-control form-control-sm" id="login-name" autocomplete="username" />
        </div>
        <div class="col-auto">
          <label class="form-label" for="login-password">Password</label>
          <input
            class="form-control form-control-sm"
            id="login-password"
            type="password"
            autocomplete="current-password"
          />
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-sm btn-primary">Sign in</button>
          <button type="button" class="btn btn-sm btn-link" id="logout-btn" hidden>
            Sign out
          </button>
        </div>
        <div class="col-12">
          <p class="text-danger small mb-0" id="login-error" hidden></p>
        </div>
      </form>
    </div>
    <div class="container py-2" id="import-panel" hidden>
      <div class="d-flex flex-wrap align-items-end gap-2">
        <div>
          <label class="form-label" for="import-profile">CSV import</label>
          <select class="form-select form-select-sm" id="import-profile"></select>
        </div>
        <label class="btn btn-sm btn-outline-secondary mb-0">
          Choose file
          <input type="file" id="import-file" accept=".csv,text/csv" hidden />
        </label>
      </div>
      <p class="small text-muted mb-0 mt-1" id="import-status"></p>
    </div>
    <div class="container py-2">
      <div id="global-hits" class="list-group mb-2" hidden></div>
      <p id="error" class="text-danger" hidden></p>
    </div>
    <div class="container py-2">
      <div id="empty-state">
        <h1 class="h4">No screens yet</h1>
        <p class="text-muted">
          Open Ops in a new tab to describe the app. Then refresh this tab.
        </p>
      </div>
      <div id="main" hidden></div>
    </div>
    <div class="modal fade" id="confirm-modal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title h5">Confirm</h2>
          </div>
          <div class="modal-body" id="confirm-body"></div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
            <button type="button" class="btn btn-danger" id="confirm-ok">Delete</button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal fade" id="new-modal" tabindex="-1" aria-labelledby="new-modal-title">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title h5" id="new-modal-title">New</h2>
          </div>
          <div class="modal-body">
            <p class="text-danger" id="new-modal-error" hidden></p>
            <form id="new-modal-form" novalidate></form>
            <!-- Sibling of the form so related inline create is not nested. -->
            <div id="new-modal-related"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
            <button type="button" class="btn btn-primary" id="new-modal-ok">Ok</button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal fade" id="details-modal" tabindex="-1" aria-labelledby="details-modal-title">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title h5" id="details-modal-title">Details</h2>
          </div>
          <div class="modal-body">
            <p class="text-danger" id="details-modal-error" hidden></p>
            <dl class="row mb-0" id="details-modal-body"></dl>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" id="details-modal-ok" data-bs-dismiss="modal">
              Ok
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
