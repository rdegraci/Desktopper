<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Desktopper</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css" />
  </head>
  <body>
    <nav class="navbar navbar-light bg-light border-bottom">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1" id="app-title">Desktopper</span>
        <form class="d-flex" role="search" onsubmit="return false;">
          <input
            class="form-control form-control-sm"
            type="search"
            id="global-search"
            placeholder="Search"
            autocomplete="off"
          />
        </form>
        <a class="nav-link" href="/ops" target="_blank" rel="noopener">Ops</a>
      </div>
    </nav>
    <div class="container py-4">
      <div id="empty-state">
        <h1 class="h4">No screens yet</h1>
        <p class="text-muted">
          Open Ops in a new tab to describe the app. Then refresh this tab.
        </p>
      </div>
    </div>
    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
